<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Angela Santurbano</title>
<meta name="description" content="Angela Santurbano is a builder PM who ships with AI. Projects, writing, and ways to reach out — in a notebook on a lamplit desk.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#241912">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --vellum:#EFE9DC; --ink:#1B2433; --print:#3B3530;
    --cloth:#1E2532; --brass:#B8934E;
    /* a page is A5-ish; on a wide screen the spread fits side by side */
    --page-w:min(37vw, 58vh);
    --page-h:calc(var(--page-w) * 1.3);   /* a little squarer than A5, so the book fills the frame */
    --veil:.88;            /* vellum opacity: set by the lamp — more light, more show-through */
  }
  @media (orientation: portrait), (max-width: 760px){
    :root{ --page-w:min(84vw, 62vh); }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;overflow:clip;background:#140D09}
  body{font-family:'EB Garamond',serif;color:var(--print)}

  /* the camera sits at the front of the desk, looking down at an angle */
  /* clip, not hidden: hidden still lets focus() and scrollIntoView() slide the whole desk sideways */
  #viewport{position:fixed;inset:0;overflow:hidden;overflow:clip;perspective:1500px;perspective-origin:50% 45%}
  #world{position:absolute;inset:0;transform-origin:50% 50%}

  /* ---------- the desk: walnut, long grain ---------- */
  #desk{position:absolute;inset:-60%;
    background:
      var(--grain),
      repeating-linear-gradient(91deg, rgba(20,10,4,.12) 0 1px, rgba(0,0,0,0) 1px 6px, rgba(255,214,170,.035) 6px 7px, rgba(0,0,0,0) 7px 17px),
      linear-gradient(178deg, #4A3424, #3E2B1E 45%, #4A3424 70%, #3A281C);
  }

  /* ---------- the lamp stands up off the desk, so it's drawn in screen space and
                pinned each frame to its spot on the tilted desk (#lampAnchor) ---------- */
  #lampAnchor{position:absolute;width:100px;height:100px;left:calc(var(--lamp-x) - 50px);top:calc(var(--lamp-y) - 50px);pointer-events:none}
  #lamp{position:absolute;left:0;top:0;width:0;height:0;z-index:4;transform-origin:0 0;pointer-events:none}
  #lamp svg{position:absolute;overflow:visible;left:0;top:0}
  #lampBtn{position:absolute;border-radius:50%;border:0;background:transparent;cursor:pointer;pointer-events:auto}
  #lampBtn:focus-visible{outline:2px solid #FFD9A0;outline-offset:6px}
  #cord{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1;pointer-events:none}

  /* ---------- the notebook ---------- */
  #book{position:absolute;z-index:2;
    width:calc(var(--page-w) * 2);height:var(--page-h);
    left:calc(50% - var(--page-w));top:calc(50% - var(--page-h) / 2);
    perspective:2600px}
  .shadow{position:absolute;top:0;height:100%;border-radius:4px;pointer-events:none;
    box-shadow:var(--book-shadow)}
  #shadowClosed{left:50%;width:50%;opacity:1}
  #shadowOpen{left:0;width:100%;opacity:0}
  .page{position:absolute;top:0;width:var(--page-w);height:var(--page-h);overflow:hidden}
  .page.right{left:var(--page-w);border-radius:2px 4px 4px 2px;
    /* the edges of the sheets beneath */
    box-shadow:1px 1px 0 #E2DACA, 2px 2px 0 #D8CFBD, 3px 3px 0 #CEC4B0, 4px 3px 0 #C3B8A3}
  .under, .sheet{position:absolute;inset:0}
  /* vellum is frosted: what lies beneath reads softly, so it never competes with fresh ink */
  .under{background:var(--vellum);padding:9% 11%;filter:blur(1.1px)}
  .sheet{background:
      linear-gradient(90deg, rgba(70,48,28,.16), rgba(70,48,28,0) 7%),
      var(--fibers),
      rgba(239,233,220,var(--veil))}
  .left .sheet{background:
      linear-gradient(270deg, rgba(70,48,28,.16), rgba(70,48,28,0) 7%),
      var(--fibers),
      var(--vellum)}
  /* its own layer: Chrome otherwise rasterizes fine SVG strokes on a steeply tilted plane into a smear */
  .ghost-title{width:46%;display:block;margin-bottom:6%;transform:translateZ(0)}
  .ghost-lines p{font-size:calc(var(--page-w) * .032);line-height:1.5;margin-bottom:.7em;color:var(--print)}

  #cover{position:absolute;left:var(--page-w);top:0;width:var(--page-w);height:var(--page-h);
    transform-origin:0 50%;transform-style:preserve-3d;z-index:3}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .front{border-radius:3px 7px 7px 3px;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,236,206,.08), rgba(0,0,0,0) 70%),
      var(--cloth-tex),
      var(--cloth);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), inset -3px 0 0 rgba(0,0,0,.25)}
  .front .band{position:absolute;top:-1px;bottom:-1px;right:9%;width:3.2%;background:#12161E;box-shadow:1px 0 2px rgba(0,0,0,.4)}
  .front .mono{position:absolute;left:0;right:0;bottom:12%;text-align:center;
    font-size:calc(var(--page-w) * .04);letter-spacing:.32em;color:rgba(0,0,0,.35);
    text-shadow:0 1px 0 rgba(255,255,255,.06)}
  .back{transform:rotateY(180deg)}
  .back .sheet{border-radius:4px 2px 2px 4px}
  /* handwriting lives in one full-page SVG per page, in page pixels */
  .inkpage{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
  .subtitle{position:absolute;left:0;right:0;text-align:center;font-style:italic;font-size:calc(var(--page-w) * .038);color:var(--print);letter-spacing:.01em}

  /* the contents are real links laid over the handwriting */
  .toc{position:absolute;inset:0;list-style:none}
  .toc a{position:absolute;display:block;border-radius:3px;color:transparent;text-decoration:none;font-size:1px;cursor:pointer}
  .toc a:focus-visible{outline:2px solid rgba(27,36,51,.45);outline-offset:2px}

  /* one pen for the whole book, in book pixels; it can rest on the desk beside it */
  #penLayer{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;z-index:4;pointer-events:none}

  /* ---------- light: a multiply layer (falloff) and a screen layer (warmth) ---------- */
  #light{position:absolute;inset:-60%;z-index:5;pointer-events:none;mix-blend-mode:multiply}
  #glow{position:absolute;inset:-60%;z-index:6;pointer-events:none;mix-blend-mode:screen}

  /* ---------- the dimmer, inline on the lamp cord ---------- */
  #dimmer{position:absolute;z-index:7;left:var(--dim-x);top:var(--dim-y);transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:6px}
  /* on wide screens the dimmer runs upright along the cord, in the margin beside the book */
  @media (orientation: landscape) and (min-width: 761px){
    #dimmer{transform:translate(-50%,-50%) rotate(-90deg)}
  }
  #dimmer label{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,226,190,.62)}
  .switch{background:linear-gradient(#2A221C,#16110D);border-radius:14px;padding:7px 12px;box-shadow:0 3px 8px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07)}
  #lampLevel{-webkit-appearance:none;appearance:none;width:112px;height:22px;background:transparent;cursor:pointer;display:block}
  #lampLevel::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#0B0806;box-shadow:inset 0 1px 1px rgba(0,0,0,.8)}
  #lampLevel::-moz-range-track{height:4px;border-radius:2px;background:#0B0806}
  #lampLevel::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:22px;margin-top:-9px;border-radius:3px;
    background:repeating-linear-gradient(0deg,#C9A35A 0 2px,#9C7A3C 2px 4px);box-shadow:0 1px 3px rgba(0,0,0,.6)}
  #lampLevel::-moz-range-thumb{width:14px;height:22px;border:0;border-radius:3px;background:repeating-linear-gradient(0deg,#C9A35A 0 2px,#9C7A3C 2px 4px)}
  #lampLevel:focus-visible{outline:2px solid #FFD9A0;outline-offset:6px;border-radius:4px}

  #replay{position:fixed;z-index:9;left:50%;bottom:16px;transform:translateX(-50%);
    font:italic 400 15px 'EB Garamond',serif;color:rgba(255,226,190,.6);background:none;border:0;cursor:pointer;
    border-bottom:1px solid rgba(255,226,190,.25)}
  #replay:hover{color:rgba(255,226,190,.9)}
  #replay:focus-visible{outline:2px solid #FFD9A0;outline-offset:4px}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<script src="https://cdn.jsdelivr.net/npm/motion@12.4.7/dist/motion.js"></script>
<script src="phrases.data.js"></script>
<script src="ink.js"></script>
</head>
<body>
<div id="viewport">
  <div id="world">
    <div id="desk"></div>
    <svg id="cord" aria-hidden="true"><path fill="none" stroke="#120C08" stroke-width="5" stroke-linecap="round"/></svg>

    <div id="book">
      <div class="shadow" id="shadowClosed"></div>
      <div class="shadow" id="shadowOpen"></div>
      <section class="page right">
        <div class="under" aria-hidden="true">
          <svg class="ghost-title" id="ghostTitle"></svg>
          <div class="ghost-lines">
            <p>The Coffee Houses of San Francisco</p>
            <p>Neko Fortune Teller</p>
            <p>Ancora</p>
            <p>Fintech voice agent</p>
            <p>Research synthesizer</p>
          </div>
        </div>
        <div class="sheet"></div>
        <svg class="inkpage" id="rightInk" aria-hidden="true"></svg>
        <nav aria-label="Contents"><ul class="toc" id="toc"></ul></nav>
      </section>
      <div id="cover">
        <div class="face front" aria-hidden="true"><div class="band"></div><div class="mono">A · S</div></div>
        <div class="face back page left">
          <div class="sheet"></div>
          <h1 class="sr-only">Angela Santurbano</h1>
          <svg class="inkpage" id="leftInk" aria-hidden="true"></svg>
          <p class="subtitle" id="subtitle">builder who ships with AI · San Francisco</p>
        </div>
      </div>
      <svg id="penLayer" aria-hidden="true"></svg>
    </div>

    <div id="lampAnchor"></div>
    <div id="light"></div>
    <div id="glow"></div>
    <div id="dimmer">
      <label for="lampLevel">Lamp</label>
      <div class="switch"><input id="lampLevel" type="range" min="25" max="100" step="1" value="70" aria-valuetext="70 percent"></div>
    </div>
  </div>
  <div id="lamp">
    <svg id="lampArt" aria-hidden="true"></svg>
    <button id="lampBtn" type="button" aria-label="Lamp: turn down"></button>
  </div>
</div>
<button id="replay" type="button">watch it written</button>

<script>
(() => {
  const M = window.Motion;
  const { el } = window.Ink;
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const root = document.documentElement;
  const world = document.getElementById('world');
  const cover = document.getElementById('cover');
  const slider = document.getElementById('lampLevel');
  const lampBtn = document.getElementById('lampBtn');
  const light = document.getElementById('light'), glow = document.getElementById('glow');

  /* ---------- textures, generated once ---------- */
  const noise = (freq, oct, rgb, a, seed) => `url("data:image/svg+xml,${encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='${freq}' numOctaves='${oct}' seed='${seed}'/><feColorMatrix values='0 0 0 0 ${rgb[0]}  0 0 0 0 ${rgb[1]}  0 0 0 0 ${rgb[2]}  0 0 0 ${a} 0'/></filter><rect width='300' height='300' filter='url(#f)'/></svg>`)}")`;
  root.style.setProperty('--grain', noise('.003 .11', 3, [.08, .04, .02], .55, 7));
  root.style.setProperty('--fibers', noise('.9 .06', 2, [.55, .5, .42], .2, 4));
  root.style.setProperty('--cloth-tex', noise('.75', 2, [.02, .03, .05], .5, 9));

  /* ---------- ink on the pages ---------- */
  function inkSvg(svg, text, padX = 120, padY = 160){
    const [x0, y0, x1, y1] = window.Ink.phrase(text).bbox;
    svg.setAttribute('viewBox', `${x0 - padX} ${y0 - padY} ${x1 - x0 + padX * 2} ${y1 - y0 + padY * 2}`);
    window.Ink.write(svg, text);
  }
  inkSvg(document.getElementById('ghostTitle'), 'Projects');

  const isPortrait = () => matchMedia('(orientation: portrait), (max-width: 760px)').matches;
  let L = 0.7;   // lamp level, 0.25..1
  try { const saved = parseFloat(localStorage.getItem('notebook.lamp')); if (saved >= .25 && saved <= 1) L = saved; } catch (e) {}

  function layout(){
    const W = innerWidth, H = innerHeight, vmin = Math.min(W, H);
    const portrait = isPortrait();
    // Placed by where they should land on screen once the book is open; the world is
    // shifted on phones (to center the left page), so subtract that shift.
    const shift = finalX();
    const lamp = portrait ? { x:W * .24 - shift, y:H * .22 } : { x:W * .19, y:H * .42 };   // the pool, under the shade
    const dim = portrait ? { x:Math.max(96, W * .26) - shift, y:H * .86 } : { x:Math.max(46, W * .05), y:H * .6 };    // in the left margin, along the cord (turned upright by CSS)
    root.style.setProperty('--lamp-x', `${lamp.x}px`); root.style.setProperty('--lamp-y', `${lamp.y}px`);
    root.style.setProperty('--dim-x', `${dim.x}px`); root.style.setProperty('--dim-y', `${dim.y}px`);

    const u = pageW() / 400;                       // lamp proportions follow the notebook
    const base = { x:-165 * u, y:-125 * u };       // the base sits behind and left of the pool
    state.u = u; state.base = base;

    // the cord: from the lamp base, through the dimmer, off the desk
    const p = `M${lamp.x + base.x} ${lamp.y + base.y} C ${lamp.x + base.x - 40} ${lamp.y + H * .2}, ${dim.x + 60} ${dim.y - H * .22}, ${dim.x} ${dim.y} S ${dim.x - 30} ${H + 40}, ${dim.x - 80} ${H + 80}`;
    document.querySelector('#cord path').setAttribute('d', p);

    // the book's shadow falls away from the lamp
    const vx = (W / 2) - lamp.x, vy = (H / 2) - lamp.y, n = Math.hypot(vx, vy);
    root.style.setProperty('--book-shadow', `${(vx / n * 16).toFixed(1)}px ${(vy / n * 16).toFixed(1)}px 34px rgba(8,4,2,.6), ${(vx / n * 4).toFixed(1)}px ${(vy / n * 4).toFixed(1)}px 6px rgba(8,4,2,.5)`);
    state.lamp = lamp; state.W = W; state.H = H;
    applyLight();
  }
  const state = {};


  /* ---------- the standing lamp ----------
     An architect-style lamp built from 3D points (x across the desk, y toward the viewer,
     z up), projected for the camera's current tilt and pinned to #lampAnchor's spot on
     screen. The shade is a cone angled toward the notebook: unlike a dome, its outline
     reads as a lamp from any angle. */
  const lampEl = document.getElementById('lamp'), lampArt = document.getElementById('lampArt');
  const anchor = document.getElementById('lampAnchor');
  const v3 = {
    add:(a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
    mul:(a, k) => [a[0] * k, a[1] * k, a[2] * k],
    norm:(a) => { const l = Math.hypot(...a); return [a[0] / l, a[1] / l, a[2] / l]; },
    cross:(a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]],
    dot:(a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2]
  };
  function hull(pts){
    const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const q of p){ while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
    for (const q of p.reverse()){ while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], q) <= 0) up.pop(); up.push(q); }
    return lo.slice(0, -1).concat(up.slice(0, -1));
  }
  const poly = (pts) => 'M' + pts.map(q => `${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' L') + ' Z';

  function drawLamp(){
    if (!state.u) return;
    const r = anchor.getBoundingClientRect(), k = r.width / 100;
    lampEl.style.transform = `translate(${r.left + r.width / 2}px, ${r.top + r.height / 2}px) scale(${k})`;
    const T = cam.tilt * Math.PI / 180, c = Math.cos(T), sn = Math.sin(T), u = state.u;
    const P = (q) => [q[0], q[1] * c - q[2] * sn];
    const camDir = [0, sn, c];
    const g = lampArt; g.innerHTML = '';
    const defs = el('defs', {}, g);
    const grad = (id, stops, attrs) => { const lg = el(attrs.r ? 'radialGradient' : 'linearGradient', { id, ...attrs }, defs); stops.forEach(([o, col]) => el('stop', { offset:o, 'stop-color':col }, lg)); };
    grad('brassCyl', [[0, '#5E4626'], [.35, '#C9A35A'], [.55, '#E6C988'], [1, '#6E5430']], { x1:0, x2:1, y1:0, y2:0 });
    grad('brassTop', [[0, '#D8B66E'], [.5, '#B08A48'], [1, '#7A5E32']], { x1:0, y1:0, x2:1, y2:1 });
    grad('enamel', [[0, '#465064'], [.4, '#222A3A'], [1, '#0A0D12']], { cx:'30%', cy:'25%', r:'95%' });
    el('feGaussianBlur', { stdDeviation:6 * u }, el('filter', { id:'soft', x:'-50%', y:'-50%', width:'200%', height:'200%' }, defs));

    // the weighted base, behind and to the left of the pool of light
    const B = [-165 * u, -125 * u, 0], baseR = 52 * u, baseH = 15 * u;
    const [bx0, by0] = P(B), [bx1, by1] = P([B[0], B[1], baseH]);
    el('ellipse', { cx:bx0 + 6 * u, cy:by0 + 4 * u, rx:baseR * 1.2, ry:baseR * 1.2 * c + 2, fill:'rgba(6,3,1,.55)', filter:'url(#soft)' }, g);
    el('path', { d:`M${bx1 - baseR} ${by1} L${bx0 - baseR} ${by0} A${baseR} ${baseR * c + .01} 0 0 0 ${bx0 + baseR} ${by0} L${bx1 + baseR} ${by1} Z`, fill:'url(#brassCyl)' }, g);
    el('ellipse', { cx:bx1, cy:by1, rx:baseR, ry:baseR * c + .01, fill:'url(#brassTop)' }, g);
    el('ellipse', { cx:bx1, cy:by1, rx:baseR * .78, ry:baseR * .78 * c + .01, fill:'none', stroke:'rgba(60,40,18,.45)', 'stroke-width':2 * u }, g);
    el('ellipse', { cx:bx1 - 1.5 * u, cy:by1 - 1.5 * u, rx:baseR * .78, ry:baseR * .78 * c + .01, fill:'none', stroke:'rgba(255,236,190,.25)', 'stroke-width':1.2 * u }, g);

    // the shade: a cone from a small top ring (A) to the open rim (R), aimed down at the book
    const n = v3.norm([1, .55, -1.05]);
    const R = [-5 * u, -5 * u, 150 * u], A = v3.add(R, v3.mul(n, -95 * u));
    const e1 = v3.norm(v3.cross(n, [0, 0, 1])), e2 = v3.cross(n, e1);
    const ring = (C, rad) => Array.from({ length:48 }, (_, i) => { const a = i / 48 * Math.PI * 2; return v3.add(C, v3.add(v3.mul(e1, Math.cos(a) * rad), v3.mul(e2, Math.sin(a) * rad))); });
    const top = ring(A, 20 * u), rim = ring(R, 74 * u);

    // jointed arm: base -> elbow -> the shade's top
    const E = [B[0] + 25 * u, B[1] - 45 * u, 215 * u];
    const seg = (a, b, w) => { const [x0, y0] = P(a), [x1, y1] = P(b); el('line', { x1:x0, y1:y0, x2:x1, y2:y1, stroke:'#A9873F', 'stroke-width':w, 'stroke-linecap':'round' }, g); };
    seg([B[0], B[1], baseH], E, 8 * u);
    seg(E, A, 7 * u);
    for (const j of [[B[0], B[1], baseH], E]){ const [jx, jy] = P(j); el('circle', { cx:jx, cy:jy, r:8 * u, fill:'#C9A35A' }, g); }

    // shade silhouette, its specular stripe, the cap, and the lamplit lip of the rim
    const proj = (pts) => pts.map(P);
    el('path', { d:poly(hull(proj(top).concat(proj(rim)))), fill:'url(#enamel)' }, g);
    const key = v3.norm([-.5, -.6, .65]);
    let best = 0, bestDot = -9;
    for (let i = 0; i < 48; i++){ const d = v3.dot(v3.norm(v3.add(rim[i], v3.mul(R, -1))), key); if (d > bestDot){ bestDot = d; best = i; } }
    const stripe = [-2, -1, 0, 1, 2].map(o => (best + o + 48) % 48);
    el('path', { d:poly(stripe.map(i => P(top[i])).concat(stripe.slice().reverse().map(i => P(rim[i])))), fill:'rgba(255,236,206,.13)' }, g);
    if (v3.dot(v3.mul(n, -1), camDir) > 0){
      el('path', { d:poly(proj(top)), fill:'url(#brassTop)' }, g);
      const [cx, cy] = P(A); el('circle', { cx, cy, r:5 * u, fill:'#7A5E32' }, g);
    }
    el('path', { d:poly(proj(rim)), fill:'none', stroke:'#B8934E', 'stroke-width':3 * u }, g);
    const lip = rim.filter(q => q[2] < R[2] - 10 * u);
    el('path', { d:'M' + proj(lip).map(q => `${q[0].toFixed(1)} ${q[1].toFixed(1)}`).join(' L'), fill:'none',
      stroke:`rgba(255,214,150,${(.25 + .6 * L).toFixed(2)})`, 'stroke-width':3 * u, 'stroke-linecap':'round', filter:L > .3 ? 'url(#soft)' : '' }, g);

    // the lamp is lit by its own spill: darker as it's dimmed
    lampArt.style.filter = `brightness(${(.6 + .4 * L).toFixed(3)})`;
    // the click target covers the shade
    const sh = proj(top.concat(rim)), xs = sh.map(q => q[0]), ys = sh.map(q => q[1]);
    Object.assign(lampBtn.style, { left:`${Math.min(...xs)}px`, top:`${Math.min(...ys)}px`, width:`${Math.max(...xs) - Math.min(...xs)}px`, height:`${Math.max(...ys) - Math.min(...ys)}px` });
  }

  /* ---------- light model ---------- */
  // Multiplier stops (r, g, b) at distances from the lamp, in fractions of the larger viewport side.
  function stops(Lv){
    const b2 = .72 + .22 * Lv, b3 = .22 + .3 * Lv;
    return [
      { d:0,                   c:[1, .96, .88] },
      { d:.22 + .3 * Lv,       c:[.99, .93, .84] },
      { d:.75 + .45 * Lv,      c:[b2, b2 * .9, b2 * .77] },
      { d:1.1 + .3 * Lv,       c:[b3, b3 * .84, b3 * .7] }
    ];
  }
  function multiplierAt(x, y, Lv){
    const vmax = Math.max(state.W, state.H), d = Math.hypot(x - state.lamp.x, y - state.lamp.y) / vmax;
    const st = stops(Lv);
    for (let i = 1; i < st.length; i++){
      if (d <= st[i].d){
        const f = (d - st[i - 1].d) / (st[i].d - st[i - 1].d);
        return st[i - 1].c.map((v, k) => v + (st[i].c[k] - v) * f);
      }
    }
    return st[st.length - 1].c;
  }
  function applyLight(){
    const vmax = Math.max(state.W, state.H);
    // the overlays are inset -60%, so shift the center into their own coordinates
    const ox = state.lamp.x + state.W * .6, oy = state.lamp.y + state.H * .6;
    const css = stops(L).map(s => `rgb(${s.c.map(v => Math.round(v * 255)).join(',')}) ${Math.round(s.d * vmax)}px`).join(', ');
    light.style.background = `radial-gradient(circle at ${ox}px ${oy}px, ${css})`;
    const r1 = (.22 + .3 * L) * vmax;
    glow.style.background = `radial-gradient(circle at ${ox}px ${oy}px, rgba(255,196,128,${(.3 * L).toFixed(3)}) 0, rgba(255,170,96,${(.1 * L).toFixed(3)}) ${Math.round(r1 * .7)}px, rgba(255,170,96,0) ${Math.round(r1 * 1.5)}px)`;
    root.style.setProperty('--veil', (.95 - .07 * L).toFixed(3));
    slider.value = Math.round(L * 100);
    slider.setAttribute('aria-valuetext', `${Math.round(L * 100)} percent`);
    lampBtn.setAttribute('aria-label', L > .3 ? 'Lamp: turn down' : 'Lamp: turn up');
    drawLamp();
  }

  /* ---------- lamp controls ---------- */
  const save = () => { try { localStorage.setItem('notebook.lamp', String(L)); } catch (e) {} };
  let lastBright = L > .3 ? L : .7, lampAnim = null;
  slider.addEventListener('input', () => { lampAnim && lampAnim.stop(); L = slider.value / 100; if (L > .3) lastBright = L; applyLight(); });
  slider.addEventListener('change', save);
  lampBtn.addEventListener('click', () => {
    const to = L > .3 ? .25 : lastBright;
    if (L > .3) lastBright = L;
    lampAnim && lampAnim.stop();
    if (!M || reduceMotion){ L = to; applyLight(); save(); return; }
    // a filament: quick to brighten, slower to fade
    lampAnim = M.animate(L, to, { duration:to > L ? .35 : .7, ease:'easeOut', onUpdate:(v) => { L = v; applyLight(); }, onComplete:save });
  });

  /* ---------- the cover opens; the camera pulls back and tilts to show the lamp ---------- */
  const pageW = () => parseFloat(getComputedStyle(document.querySelector('.page')).width);
  const CLOSE_SCALE = 1.22;
  const tiltParam = parseFloat(new URLSearchParams(location.search).get('tilt'));
  const TILT = () => !isNaN(tiltParam) ? tiltParam : (isPortrait() ? 22 : 32);
  const cam = { x:0, scale:1, tilt:0 };
  // On a phone only one page fits: the camera opens on the name page, then pans to the
  // contents page and rests there (it's the navigation). Wide screens see both pages.
  const nameX = () => isPortrait() ? pageW() / 2 : 0;
  const finalX = () => isPortrait() ? -pageW() / 2 : 0;
  cam.targetX = null;   // where the camera pulls back to; null means its resting view
  function applyCamera(){
    world.style.transform = `translateX(${cam.x}px) scale(${cam.scale}) rotateX(${cam.tilt}deg)`;
    drawLamp();
  }
  function setCamera(p){
    // p: 0 = close and straight overhead on the closed cover, 1 = pulled back, tilted
    const x0 = -CLOSE_SCALE * pageW() / 2, x1 = cam.targetX ?? finalX();
    cam.x = x0 + (x1 - x0) * p;
    cam.scale = CLOSE_SCALE + (1 - CLOSE_SCALE) * p;
    cam.tilt = TILT() * p;
    applyCamera();
  }
  function setCover(open){
    cover.style.transform = `rotateY(${open ? -180 : 0}deg)`;
    document.getElementById('shadowClosed').style.opacity = open ? 0 : 1;
    document.getElementById('shadowOpen').style.opacity = open ? 1 : 0;
  }
  let opening = [];
  function open(){
    opening.forEach(c => c.stop()); opening = [];
    if (!M || reduceMotion){ setCover(true); setCamera(1); return; }
    setCover(false); setCamera(0);
    opening = [
      M.animate(cover, { rotateY:[0, -180] }, { duration:1.15, delay:.45, ease:[.55, 0, .25, 1] }),
      M.animate(0, 1, { duration:1.7, delay:.35, ease:[.45, 0, .2, 1], onUpdate:setCamera }),
      M.animate('#shadowClosed', { opacity:[1, 0] }, { duration:.5, delay:.75 }),
      M.animate('#shadowOpen', { opacity:[0, 1] }, { duration:.6, delay:1.1 })
    ];
  }

  /* ---------- the writing ----------
     One pen, one timeline: the name (slowly), then the contents. Every stroke is built
     hidden, timed by its length and curvature, and revealed by render(t). */
  const Ink = window.Ink;
  const leftInk = document.getElementById('leftInk'), rightInk = document.getElementById('rightInk');
  const penLayer = document.getElementById('penLayer'), subtitle = document.getElementById('subtitle');
  const toc = document.getElementById('toc'), hint = document.getElementById('replay');
  const ENTRIES = [
    // lowercase numerals: a cursive capital I reads as a J
    { text:'Projects', num:'i', href:'#projects' },
    { text:'Writing', num:'ii', href:'#writing' },
    { text:'About', num:'iii', href:'#about' },
    { text:'Reach out', num:'iv', href:'#reach-out' }
  ];
  const NAME_TEMPO = 4, TEXT_TEMPO = 1.5;     // 1 = a brisk hand
  const NAME_MS = 1350;                        // the name's pen-down time at tempo 1
  const WRITE_DELAY = .15;                     // seconds after the cover is open and the camera has settled
  const DRY_MS = 1200, PEN_ANGLE = 38, REST_ANGLE = 72;   // at rest the pen lies upright in the margin
  let ink = null, rows = [], penG = null, shadowG = null, penScale = 1, penPos = [0, 0];

  const toBook = (page, p) => page === 'right' ? [p[0] + pageW(), p[1]] : p;
  function restPos(){
    const W = innerWidth, H = innerHeight, pw = pageW(), ph = pw * 1.3;
    const w = isPortrait() ? [W * .74 - finalX(), H * .86] : [W / 2 + pw + Math.min(W * .05, 60), H * .3];   // on the desk, right of the book
    return [w[0] - (W / 2 - pw), w[1] - (H / 2 - ph / 2)];
  }
  let msPerWeight = 0;
  function calibrate(){
    if (!msPerWeight) msPerWeight = NAME_MS / Ink.phrase('Angela Santurbano').strokes.reduce((a, st) => a + Ink.timing(st.pts).weight, 0);
    return msPerWeight;
  }

  function buildInk(){
    const pw = pageW(), ph = pw * 1.3;
    for (const svg of [leftInk, rightInk]){ svg.innerHTML = ''; svg.setAttribute('viewBox', `0 0 ${pw} ${ph}`); }
    toc.innerHTML = ''; rows = [];
    const jobs = [];

    // the name, inside the front cover
    const nP = Ink.phrase('Angela Santurbano'), nW = nP.bbox[2] - nP.bbox[0], sName = pw * .8 / nW, base = ph * .45;
    const name = Ink.prepare(leftInk, nP.strokes, { x:(pw - nW * sName) / 2 - nP.bbox[0] * sName, y:base, s:sName });
    jobs.push({ page:'left', strokes:name.strokes, tempo:NAME_TEMPO, after:'subtitle' });
    subtitle.style.top = `${base + ph * .075}px`;

    // the contents, on the first page
    const sText = pw * .074 / 1000, sHead = sText * 1.1, sNum = sText * .85;
    const cP = Ink.phrase('Contents');
    jobs.push({ page:'right', tempo:TEXT_TEMPO, before:'contents', pause:isPortrait() ? 900 : 0,
      strokes:Ink.prepare(rightInk, cP.strokes, { x:pw * .13 - cP.bbox[0] * sHead, y:ph * .17, s:sHead }).strokes });
    const left = pw * .15, right = pw * .86;
    ENTRIES.forEach((e, i) => {
      const y = ph * (.31 + i * .1);
      const tP = Ink.phrase(e.text), mP = Ink.phrase(e.num);
      const tW = (tP.bbox[2] - tP.bbox[0]) * sText, mW = (mP.bbox[2] - mP.bbox[0]) * sNum;
      const title = Ink.prepare(rightInk, tP.strokes, { x:left - tP.bbox[0] * sText, y, s:sText });
      const num = Ink.prepare(rightInk, mP.strokes, { x:right - mW - mP.bbox[0] * sNum, y, s:sNum });
      // the dotted leader: the pen taps out each dot
      const d0 = left + tW + pw * .035, d1 = right - mW - pw * .035, gap = pw * .026;
      const count = Math.max(0, Math.floor((d1 - d0) / gap) + 1);
      const dotStrokes = Array.from({ length:count }, (_, k) => { const X = (d0 + k * gap) / sText; return { pts:[X, -10, X + 12, -6], word:k }; });
      const dots = Ink.prepare(rightInk, dotStrokes, { x:0, y, s:sText });
      jobs.push({ page:'right', tempo:TEXT_TEMPO, strokes:title.strokes });
      jobs.push({ page:'right', tempo:TEXT_TEMPO, strokes:dots.strokes, hop:true });
      jobs.push({ page:'right', tempo:TEXT_TEMPO, strokes:num.strokes });

      // the entry itself is a real link over the row
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = e.href; a.textContent = `${e.text}, section ${e.num}`;
      Object.assign(a.style, { left:`${left - pw * .02}px`, top:`${y - ph * .065}px`, width:`${right - left + pw * .04}px`, height:`${ph * .085}px` });
      li.appendChild(a); toc.appendChild(li);
      rows.push({ a, x0:left, x1:left + tW, y:y + ph * .02, s:sText, underline:null });
      a.addEventListener('pointerenter', () => underline(i, true));
      a.addEventListener('pointerleave', () => underline(i, false));
      a.addEventListener('focus', () => underline(i, true));
      a.addEventListener('blur', () => underline(i, false));
    });

    // the pen: drawn once, moved by placePen()
    penLayer.innerHTML = '';
    const defs = el('defs', {}, penLayer);
    el('feGaussianBlur', { stdDeviation:3 }, el('filter', { id:'penBlur', x:'-20%', y:'-60%', width:'140%', height:'220%' }, defs));
    shadowG = el('g', { filter:'url(#penBlur)', opacity:.5 }, penLayer); Ink.pen(shadowG, '#0E0805');
    penG = el('g', {}, penLayer); Ink.pen(penG);
    penScale = pw * .78 / 270;

    timeline(jobs);
  }

  function timeline(jobs){
    const W8 = calibrate(), segs = [], strokes = [], events = [];
    let t = 0, pos = restPos(), first = true;
    for (const job of jobs){
      job.strokes.forEach((st, i) => {
        const to = toBook(job.page, Ink.start(st)), dist = Math.hypot(to[0] - pos[0], to[1] - pos[1]);
        let gap, lift;
        if (i === 0){                                                        // over to the next phrase
          if (job.before) events.push({ t, name:job.before });
          gap = 240 + dist * .9 + (job.pause || 0); lift = 1;
        }
        else if (job.hop){ gap = 24; lift = .25; }                          // dot to dot, quick taps
        else {
          const sameWord = st.word === job.strokes[i - 1].word;
          gap = ((sameWord ? 55 : 140) + dist / st.s * .035) * Math.sqrt(job.tempo);   // a slow hand still lifts briskly
          lift = sameWord ? .55 : 1;
        }
        segs.push({ type:'move', from:pos, to, t0:t, t1:t += gap, lift, fromRest:first });
        first = false;
        const dur = job.hop ? 30 : st.tm.weight * W8 * job.tempo;
        st.t0 = t; st.t1 = t + dur;
        segs.push({ type:'write', st, page:job.page, t0:t, t1:t += dur });
        strokes.push(st);
        pos = toBook(job.page, Ink.end(st));
      });
      if (job.after) events.push({ t, name:job.after });
    }
    segs.push({ type:'move', from:pos, to:restPos(), t0:t, t1:t += 800, lift:1, toRest:true });
    ink = { segs, strokes, events, T:t + DRY_MS, seg:0, ev:0 };
  }

  function frac(st, t){
    const tm = st.tm, target = (t - st.t0) / (st.t1 - st.t0) * tm.weight;
    let lo = 0, hi = tm.time.length - 1;
    while (hi - lo > 1){ const mid = (lo + hi) >> 1; if (tm.time[mid] < target) lo = mid; else hi = mid; }
    const f = (target - tm.time[lo]) / ((tm.time[hi] - tm.time[lo]) || 1);
    return Math.min(1, (tm.len[lo] + (tm.len[hi] - tm.len[lo]) * f) / tm.total);
  }

  function placePen(p, lift, rest){
    penPos = p;
    const a = PEN_ANGLE + (REST_ANGLE - PEN_ANGLE) * rest, k = penScale;
    penG.setAttribute('transform', `translate(${p[0]} ${p[1]}) rotate(${a}) scale(${k * (1 + .05 * lift)})`);
    // lit from the lamp at the top left: the shadow falls down and right, meeting the nib on the paper
    shadowG.setAttribute('transform', `translate(${p[0] + (3 + 30 * lift) * k} ${p[1] + (4 + 45 * lift) * k}) rotate(${a + 4 + 3 * lift}) scale(${k})`);
    shadowG.setAttribute('opacity', (.5 - .2 * lift).toFixed(2));
  }

  function render(t, instant){
    for (const st of ink.strokes){
      if (t < st.t0){ Ink.show(st, -1); continue; }
      Ink.show(st, t >= st.t1 ? 1 : frac(st, t), t < st.t1 ? 1 : Math.max(0, 1 - (t - st.t1) / DRY_MS));
    }
    if (t < ink.segs[ink.seg].t0) ink.seg = 0;
    while (ink.seg < ink.segs.length - 1 && t >= ink.segs[ink.seg].t1) ink.seg++;
    const g = ink.segs[ink.seg];
    if (g.type === 'write') placePen(toBook(g.page, Ink.at(g.st, frac(g.st, t))), 0, 0);
    else {
      const f = Math.min(1, Math.max(0, (t - g.t0) / (g.t1 - g.t0))), e = f * f * (3 - 2 * f);
      const rest = g.fromRest ? 1 - e : g.toRest ? e : 0;
      placePen([g.from[0] + (g.to[0] - g.from[0]) * e, g.from[1] + (g.to[1] - g.from[1]) * e], Math.sin(Math.PI * f) * g.lift, rest);
    }
    if (t < (ink.events[ink.ev - 1] || { t:-1 }).t) ink.ev = 0;
    while (ink.ev < ink.events.length && t >= ink.events[ink.ev].t) fire(ink.events[ink.ev++].name, instant);
  }
  let panAnim = null;
  function fire(name, instant){
    if (name === 'contents' && isPortrait() && !instant && M && !reduceMotion){
      panAnim = M.animate(cam.x, finalX(), { duration:1, ease:[.45, 0, .2, 1], onUpdate:(v) => { cam.x = v; cam.targetX = v; applyCamera(); } });
    }
    if (name === 'subtitle'){
      if (instant || !M || reduceMotion){ subtitle.style.opacity = 1; subtitle.style.transform = ''; }
      else M.animate(subtitle, { opacity:[0, 1], y:[6, 0] }, { duration:.9, ease:'easeOut' });
    }
  }

  /* ---------- playback: first visit only, skippable, replayable ---------- */
  let writing = null;
  const seen = () => { try { return localStorage.getItem('notebook.seen') === '1'; } catch (e) { return false; } };
  const markSeen = () => { try { localStorage.setItem('notebook.seen', '1'); } catch (e) {} };
  function setHint(mode){
    hint.dataset.mode = mode;
    hint.textContent = mode === 'skip' ? 'click anywhere to skip' : 'watch it written';
    if (mode === 'skip' && M && !reduceMotion){ hint.style.opacity = 0; M.animate(hint, { opacity:[0, 1] }, { duration:.8, delay:2 }); }
    else hint.style.opacity = '';
  }
  function showFinished(){
    run++;
    if (writing){ writing.stop(); writing = null; }
    opening.forEach(c => c.stop()); opening = [];
    panAnim && panAnim.stop();
    cam.targetX = null;
    setCover(true); setCamera(1);
    render(ink.T, true);
    setHint('replay');
  }
  let run = 0;   // bumped on every play/skip, so a stale chain never starts the pen
  function play(){
    if (!M || reduceMotion){ showFinished(); markSeen(); return; }
    const me = ++run;
    cam.targetX = nameX();
    open();
    subtitle.style.opacity = 0;
    ink.seg = 0; ink.ev = 0; render(0);
    setHint('skip');
    // the pen sets off once the cover is open and the camera has settled
    Promise.all(opening).then(() => {
      if (me !== run) return;
      opening = [];
      writing = M.animate(0, ink.T, { duration:ink.T / 1000, delay:WRITE_DELAY, ease:'linear', onUpdate:(t) => render(t),
        onComplete:() => { writing = null; markSeen(); setHint('replay'); } });
    });
  }
  const playing = () => !!writing || opening.length > 0;
  // any click or key during the opening finishes it at once
  const skip = () => { if (playing()){ showFinished(); markSeen(); } };
  addEventListener('keydown', (e) => { if (e.key !== 'Tab') skip(); });
  document.getElementById('viewport').addEventListener('pointerdown', skip, true);
  hint.addEventListener('click', () => { if (playing()) skip(); else play(); });

  /* ---------- hovering an entry: the pen comes over and underlines it ---------- */
  let penAnim = null;
  function underline(i, on){
    if (playing()) return;
    const row = rows[i], pw = pageW();
    penAnim && penAnim.stop();
    if (!on){
      if (row.underline){
        const st = row.underline; row.underline = null;
        if (M && !reduceMotion) M.animate(st.g, { opacity:0 }, { duration:.4 }).then(() => st.g.remove()); else st.g.remove();
      }
      if (rows.some(r => r.underline)) return;
      const from = penPos, to = restPos();
      if (!M || reduceMotion){ placePen(to, 0, 1); return; }
      penAnim = M.animate(0, 1, { duration:.6, ease:'easeInOut', onUpdate:(f) => placePen([from[0] + (to[0] - from[0]) * f, from[1] + (to[1] - from[1]) * f], Math.sin(Math.PI * f), f) });
      return;
    }
    if (row.underline) return;
    // a gently wavering line under the entry, in font units at the entry's scale
    const pts = [];
    for (let k = 0; k <= 10; k++){ pts.push((row.x0 + (row.x1 - row.x0) * k / 10) / row.s, Math.sin(k * .8) * 14); }
    const st = Ink.prepare(rightInk, [{ pts }], { x:0, y:row.y, s:row.s }).strokes[0];
    row.underline = st;
    if (!M || reduceMotion){ Ink.show(st, 1, 0); return; }
    const from = penPos, to = toBook('right', Ink.start(st));
    penAnim = M.animate(0, 1, { duration:.75, ease:'linear', onUpdate:(f) => {
      if (f < .45){ const g = f / .45, e = g * g * (3 - 2 * g); placePen([from[0] + (to[0] - from[0]) * e, from[1] + (to[1] - from[1]) * e], Math.sin(Math.PI * g) * .7, 0); }
      else { const g = (f - .45) / .55; Ink.show(st, g, 1); placePen(toBook('right', Ink.at(st, g)), 0, 0); }
    }, onComplete:() => Ink.show(st, 1, 0) });
  }

  addEventListener('resize', () => { const was = playing(); showFinished(); if (was) markSeen(); layout(); buildInk(); render(ink.T, true); });

  /* ---------- dev check: is every word readable at the dimmest lamp? (?debug) ---------- */
  if (location.search.includes('debug')){
    const lum = (c) => { const f = (v) => v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); return .2126 * f(c[0]) + .7152 * f(c[1]) + .0722 * f(c[2]); };
    const hex = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
    window.contrastReport = (Lv = .25) => {
      // worst case over the whole left page, in desk coordinates
      const pw = pageW(), ph = pw * 1.3, W = state.W, H = state.H;
      const pts = [[W / 2 - pw, H / 2 - ph / 2], [W / 2, H / 2 - ph / 2], [W / 2 - pw, H / 2 + ph / 2], [W / 2, H / 2 + ph / 2]];
      return [['name', '#1B2433'], ['subtitle', '#3B3530']].map(([what, color]) => {
        let worst = 99;
        for (const [x, y] of pts){
          const m = multiplierAt(x, y, Lv);
          const paper = hex('#EFE9DC').map((v, i) => v * m[i]), ink = hex(color).map((v, i) => v * m[i]);
          worst = Math.min(worst, (lum(paper) + .05) / (lum(ink) + .05));
        }
        return `${what}: at least ${worst.toFixed(2)}:1 anywhere on the page at lamp ${Math.round(Lv * 100)}%`;
      });
    };
  }

  function start(){ layout(); buildInk(); if (seen()) showFinished(); else play(); }
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
</body>
</html>
